<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Avatar lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #120d0a;
        color: #e9dfcc;
        font:
          12px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #lab {
        display: block;
        width: 100%;
        height: 100%;
      }
      #tags {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .tag {
        position: absolute;
        transform: translate(-50%, -100%);
        white-space: nowrap;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(10, 7, 5, 0.6);
        color: #f1e6d0;
        font-size: 11px;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 6px;
        padding: 3px 7px;
        border-radius: 3px;
        background: rgba(10, 7, 5, 0.6);
        pointer-events: none;
        white-space: pre;
      }
      #errors {
        position: fixed;
        left: 8px;
        bottom: 8px;
        right: 8px;
        color: #ff8a7a;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div id="tags"></div>
    <div id="hud"></div>
    <div id="errors"></div>
    <script type="module" src="/src/avatar-lab.ts"></script>
  </body>
</html>
