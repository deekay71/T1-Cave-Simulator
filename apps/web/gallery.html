<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Model gallery</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #120d0a;
        color: #e9dfcc;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #gallery {
        display: block;
        width: 100%;
        height: 100%;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, 6px);
        white-space: nowrap;
        text-align: center;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(10, 7, 5, 0.62);
        color: #f1e6d0;
        font-size: 11px;
      }
      .lbl b {
        font-weight: 600;
      }
      .lbl .over {
        color: #ff6b5e;
        font-weight: 700;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 6px;
        max-width: 70vw;
        padding: 3px 7px;
        border-radius: 3px;
        background: rgba(10, 7, 5, 0.55);
        pointer-events: none;
        white-space: pre-wrap;
      }
      #errors {
        position: fixed;
        left: 8px;
        bottom: 8px;
        right: 8px;
        color: #ff8a7a;
        white-space: pre-wrap;
        pointer-events: none;
      }
      #index {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 16px 20px;
        display: none;
      }
      #index a {
        color: #ffb24c;
      }
    </style>
  </head>
  <body>
    <canvas id="gallery"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="errors"></div>
    <div id="index"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
