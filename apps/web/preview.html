<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>World preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0907;
        color: #e9dfcc;
        font:
          12px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #stats {
        position: fixed;
        left: 8px;
        top: 6px;
        padding: 3px 7px;
        border-radius: 3px;
        background: rgba(10, 7, 5, 0.6);
        pointer-events: none;
        white-space: pre;
        display: none;
      }
      #errors {
        position: fixed;
        left: 8px;
        bottom: 8px;
        right: 8px;
        color: #ff8a7a;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="stats"></div>
    <div id="errors"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
