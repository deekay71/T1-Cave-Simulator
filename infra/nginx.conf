server {
 listen 80;
 root /usr/share/nginx/html;

 # API phía sau gửi IP thật của người dùng qua X-Forwarded-For (API đặt TRUST_PROXY=1).
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;

 gzip on;
 gzip_min_length 1024;
 gzip_proxied any;
 gzip_types application/javascript text/css application/json model/gltf-binary;

 # JS/CSS có hash trong tên file: cache lâu dài. index.html luôn hỏi lại để nhận bản mới.
 location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 # Model GLB không có hash trong tên: cache ngắn.
 location ^~ /models/ {
  types { model/gltf-binary glb; application/json json; }
  try_files $uri =404;
  expires 1h;
 }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
 location ^~ /v1/ { proxy_pass http://api:3000; }
 location ^~ /health/ { proxy_pass http://api:3000; }
 location ^~ /matchmake/ { proxy_pass http://game:2567; proxy_http_version 1.1; }
 # WebSocket của Colyseus: /{processId}/{roomId}
 location ~ ^/[^/]+/[^/]+$ {
  proxy_pass http://game:2567;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 75s;
 }
}
